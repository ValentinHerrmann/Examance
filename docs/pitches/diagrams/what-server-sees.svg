<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif"><defs><marker id="ac9d1da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1da"/></marker><marker id="sc9d1da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9d1da"/></marker><marker id="aff9e94" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9e94"/></marker><marker id="sff9e94" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ff9e94"/></marker><marker id="affb733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffb733"/></marker><marker id="sffb733" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ffb733"/></marker><marker id="a2ee6b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ee6b0"/></marker><marker id="s2ee6b0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2ee6b0"/></marker><marker id="a9cc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9cc8f0"/></marker><marker id="s9cc8f0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9cc8f0"/></marker></defs><rect width="1400" height="470" rx="16" fill="#16191d"/><rect x="12" y="10" width="448" height="450" rx="14" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="34" y="48" font-size="22" fill="#2ee6b0" font-weight="700" text-anchor="start">Nur als Chiffrat auf dem Server</text><text x="34" y="76" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start" font-style="italic">AES-256-GCM, Schlüssel nur im Browser</text><circle cx="42" cy="114" r="4.5" fill="#2ee6b0"/><text x="56" y="120" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Namen und Schülernummern</text><circle cx="42" cy="154" r="4.5" fill="#2ee6b0"/><text x="56" y="160" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Scans der Arbeiten</text><circle cx="42" cy="194" r="4.5" fill="#2ee6b0"/><text x="56" y="200" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Anmerkungen der Korrektur</text><circle cx="42" cy="234" r="4.5" fill="#2ee6b0"/><text x="56" y="240" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Punkte je Aufgabe, MC-Kreuze,</text><text x="56" y="280" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Erkennungsdaten</text><circle cx="42" cy="314" r="4.5" fill="#2ee6b0"/><text x="56" y="320" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Im Hybrid-Modus: gar nicht</text><text x="56" y="360" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">auf dem Server</text><rect x="476" y="10" width="448" height="450" rx="14" fill="#2a2214" stroke="#8a6418" stroke-width="2"/><text x="498" y="48" font-size="22" fill="#ffb733" font-weight="700" text-anchor="start">Lesbar auf dem Server</text><text x="498" y="76" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start" font-style="italic">nötig für Bibliothek, Satz und Konto</text><circle cx="506" cy="114" r="4.5" fill="#ffb733"/><text x="520" y="120" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Aufgaben- und Klausurtexte (LaTeX)</text><text x="520" y="160" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">samt Dateien der Aufgaben</text><circle cx="506" cy="194" r="4.5" fill="#ffb733"/><text x="520" y="200" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Klausurdaten: Titel, Klasse, Fach,</text><text x="520" y="240" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Datum, Nachname der Lehrkraft</text><circle cx="506" cy="274" r="4.5" fill="#ffb733"/><text x="520" y="280" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Gesamtpunktzahl je Abgabe (pseudonym)</text><circle cx="506" cy="314" r="4.5" fill="#ffb733"/><text x="520" y="320" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">E-Mail, Rolle, Freischaltungen</text><circle cx="506" cy="354" r="4.5" fill="#ffb733"/><text x="520" y="360" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Passwort nur als Argon2id-Hash</text><rect x="940" y="10" width="448" height="450" rx="14" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="962" y="48" font-size="22" fill="#9cc8f0" font-weight="700" text-anchor="start">Nie auf dem Server</text><text x="962" y="76" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start" font-style="italic">bleibt beim Menschen oder im Browser</text><circle cx="970" cy="114" r="4.5" fill="#9cc8f0"/><text x="984" y="120" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Datenschlüssel und Sitzungsschlüssel</text><circle cx="970" cy="154" r="4.5" fill="#9cc8f0"/><text x="984" y="160" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Wiederherstellungscode</text><circle cx="970" cy="194" r="4.5" fill="#9cc8f0"/><text x="984" y="200" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Zuordnung Pseudonym → Name</text><text x="984" y="240" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">im Klartext</text><circle cx="970" cy="274" r="4.5" fill="#9cc8f0"/><text x="984" y="280" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Im Hybrid-Modus: Schülerdaten,</text><text x="984" y="320" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Scans und Punkte</text></svg>
