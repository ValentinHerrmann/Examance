<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif"><defs><marker id="ac9d1da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1da"/></marker><marker id="sc9d1da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9d1da"/></marker><marker id="aff9e94" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9e94"/></marker><marker id="sff9e94" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ff9e94"/></marker><marker id="affb733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffb733"/></marker><marker id="sffb733" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ffb733"/></marker><marker id="a2ee6b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ee6b0"/></marker><marker id="s2ee6b0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2ee6b0"/></marker><marker id="a9cc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9cc8f0"/></marker><marker id="s9cc8f0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9cc8f0"/></marker></defs><rect width="1400" height="470" rx="16" fill="#16191d"/><rect x="12" y="10" width="676" height="330" rx="16" fill="none" stroke="#4f7aa3" stroke-width="2" stroke-dasharray="8 6"/><text x="28" y="36" font-size="15" fill="#9cc8f0" font-weight="700" text-anchor="start">SERVER-MODUS (ALL-SERVER)</text><rect x="36" y="56" width="290" height="200" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="52" y="84" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Browser</text><text x="52" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Schlüssel, Satz, Scan-</text><text x="52" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">verarbeitung, Auswertung</text><text x="52" y="152" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="52" y="173" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">nur Zwischenspeicher,</text><text x="52" y="194" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">beim Sperren gelöscht</text><rect x="374" y="56" width="290" height="200" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="390" y="84" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Server</text><text x="390" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Aufgaben, Klausuren</text><text x="390" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Ergebnisse als Chiffrat:</text><text x="390" y="152" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Namen, Scans, Punkte</text><text x="390" y="173" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">+ Gesamtpunktzahl</text><path d="M330,156 L368,156" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)" marker-start="url(#s9cc8f0)"/><text x="36" y="290" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start">mehrere Geräte · Sicherung auf dem Server · von der Administration freizugeben</text><text x="36" y="318" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start">Der Modus gehört zum Konto und gilt für alle seine Browser.</text><rect x="712" y="10" width="676" height="330" rx="16" fill="none" stroke="#4f7aa3" stroke-width="2" stroke-dasharray="8 6"/><text x="728" y="36" font-size="15" fill="#9cc8f0" font-weight="700" text-anchor="start">HYBRID-MODUS</text><rect x="736" y="56" width="290" height="200" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="752" y="84" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Browser</text><text x="752" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Schlüssel, Satz, Scan-</text><text x="752" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">verarbeitung, Auswertung</text><text x="752" y="152" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="752" y="173" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Ergebnisse: nur hier,</text><text x="752" y="194" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">verschlüsselt (IndexedDB)</text><rect x="1074" y="56" width="290" height="200" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="1090" y="84" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Server</text><text x="1090" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Aufgaben, Klausuren</text><text x="1090" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="1090" y="152" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">keine Schülerdaten,</text><text x="1090" y="173" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">keine Scans, keine Punkte</text><path d="M1030,156 L1068,156" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)" marker-start="url(#s9cc8f0)"/><text x="736" y="290" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start">ein Browser · Sicherung als verschlüsseltes Archiv · private Geräte: Landesrecht prüfen</text><text x="736" y="318" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start">Der Modus gehört zum Konto und gilt für alle seine Browser.</text><text x="12" y="380" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Wechsel = Umzug der Ergebnisse:</text><rect x="12" y="400" width="202.4" height="50" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="113.2" y="428" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="middle">je Klausur kopieren</text><path d="M218.4,425 L254.4,425" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><rect x="260.4" y="400" width="144.8" height="50" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="332.79999999999995" y="428" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="middle">Anzahl prüfen</text><path d="M409.2,425 L445.2,425" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><rect x="451.2" y="400" width="260.0" height="50" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="581.2" y="428" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="middle">erst dann Modus umstellen</text><path d="M715.2,425 L751.2,425" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><rect x="757.2" y="400" width="327.2" height="50" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="920.8000000000001" y="428" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="middle">alte Kopie behalten oder löschen</text></svg>
