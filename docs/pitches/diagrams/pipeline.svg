<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 402" width="1400" height="402" font-family="Inter, 'Segoe UI', system-ui, sans-serif"><defs><marker id="ac9d1da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1da"/></marker><marker id="sc9d1da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9d1da"/></marker><marker id="aff9e94" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9e94"/></marker><marker id="sff9e94" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ff9e94"/></marker><marker id="affb733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffb733"/></marker><marker id="sffb733" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ffb733"/></marker><marker id="a2ee6b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ee6b0"/></marker><marker id="s2ee6b0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2ee6b0"/></marker><marker id="a9cc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9cc8f0"/></marker><marker id="s9cc8f0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9cc8f0"/></marker></defs><rect width="1400" height="402" rx="16" fill="#16191d"/><rect x="12" y="20" width="205" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="28" y="48" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Aufgabe</text><text x="28" y="74" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">LaTeX aus der Bibliothek</text><text x="28" y="95" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">jedes \BE = ein Punkt</text><text x="28" y="116" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Varianten A/B</text><rect x="244" y="20" width="205" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="260" y="48" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Klausur setzen</text><text x="260" y="74" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">XeLaTeX im Browser (WASM)</text><text x="260" y="95" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">oder Tectonic auf dem</text><text x="260" y="116" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Server, falls erlaubt</text><rect x="476" y="20" width="205" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="492" y="48" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Drucken, schreiben</text><text x="492" y="74" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">QR-Code mit Pseudonym</text><text x="492" y="95" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">und Passmarken –</text><text x="492" y="116" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">kein Name auf dem Bogen</text><rect x="708" y="20" width="437" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="724" y="48" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Weg A · Auf Papier korrigieren</text><text x="724" y="74" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Rotstift wie gewohnt; Punkte je Aufgabe</text><text x="724" y="95" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">eintippen oder aus Excel einfügen</text><rect x="476" y="240" width="205" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="492" y="268" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Scannen</text><text x="492" y="294" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">ein PDF für den</text><text x="492" y="315" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">ganzen Stapel,</text><text x="492" y="336" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Schulkopierer genügt</text><rect x="708" y="240" width="205" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="724" y="268" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Zuordnen</text><text x="724" y="294" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">QR-Codes lesen, Seiten</text><text x="724" y="315" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">sortieren; Unlesbares</text><text x="724" y="336" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">kommt in eine Prüfliste</text><rect x="940" y="240" width="205" height="150" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="956" y="268" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Korrigieren</text><text x="956" y="294" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">anonym, mit Stempeln;</text><text x="956" y="315" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">MC-Kreuze gelesen,</text><text x="956" y="336" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Unsicheres vorgelegt</text><rect x="1172" y="20" width="205" height="370" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="1188" y="48" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Ergebnisse</text><text x="1188" y="74" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Namen erst jetzt –</text><text x="1188" y="95" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">im Browser entschlüsselt</text><text x="1188" y="116" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="1188" y="137" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Notenspiegel,</text><text x="1188" y="158" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Grenzfälle,</text><text x="1188" y="179" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Variantenvergleich,</text><text x="1188" y="200" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Aufgabenqualität,</text><text x="1188" y="221" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Export</text><path d="M219,95 L240,95" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M451,95 L472,95" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M683,95 L704,95" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M1147,95 L1168,95" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M578.5,172 L578.5,236" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="588.5" y="210" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="start" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Weg B</text><path d="M683,315 L704,315" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M915,315 L936,315" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M1147,315 L1168,315" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><rect x="12" y="240" width="437" height="150" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="28" y="268" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Im Browser verschlüsselt</text><text x="28" y="294" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Scans, Namen, Anmerkungen und</text><text x="28" y="315" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Einzelpunkte werden verschlüsselt,</text><text x="28" y="336" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">bevor sie gespeichert werden</text></svg>
