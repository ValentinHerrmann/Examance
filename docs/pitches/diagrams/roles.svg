<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" width="1400" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif"><defs><marker id="ac9d1da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1da"/></marker><marker id="sc9d1da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9d1da"/></marker><marker id="aff9e94" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9e94"/></marker><marker id="sff9e94" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ff9e94"/></marker><marker id="affb733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffb733"/></marker><marker id="sffb733" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ffb733"/></marker><marker id="a2ee6b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ee6b0"/></marker><marker id="s2ee6b0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2ee6b0"/></marker><marker id="a9cc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9cc8f0"/></marker><marker id="s9cc8f0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9cc8f0"/></marker></defs><rect width="1400" height="430" rx="16" fill="#16191d"/><rect x="12" y="10" width="440" height="410" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="28" y="38" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Administration</text><text x="28" y="64" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Registrierungen freigeben, einladen</text><text x="28" y="86" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Schul-Domains automatisch freischalten</text><text x="28" y="108" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">pro Konto schalten:</text><text x="28" y="130" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">  · Ergebnisse auf dem Server</text><text x="28" y="152" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">  · LaTeX-Satz auf dem Server</text><text x="28" y="174" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">  · Aufgaben teilen</text><text x="28" y="196" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Konten löschen, Passwort zurücksetzen</text><text x="28" y="218" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="28" y="240" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">kein Zugriff auf Klausuren,</text><text x="28" y="262" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Aufgaben oder Ergebnisse</text><rect x="948" y="10" width="440" height="410" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="964" y="38" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Lehrkraft</text><text x="964" y="64" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">eigene Aufgaben und Klausuren</text><text x="964" y="86" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Schülerdaten, Scans, Punkte –</text><text x="964" y="108" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">entschlüsselt nur im eigenen Browser</text><text x="964" y="130" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Speicher-Modus wählen</text><text x="964" y="152" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="964" y="174" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Aufgaben teilen (nur Aufgabentexte,</text><text x="964" y="196" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">nach Pflichtbestätigung; nie Klausuren,</text><text x="964" y="218" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Scans oder Ergebnisse)</text><text x="964" y="240" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="964" y="262" font-size="16" fill="#c9d1da" font-weight="400" text-anchor="start">Wiederherstellungscode auf Papier</text><rect x="500" y="240" width="400" height="140" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="516" y="268" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Datenbank</text><text x="516" y="294" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Schülerdaten nur als Chiffrat –</text><text x="516" y="315" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">auch per Direktzugriff unlesbar</text><rect x="500" y="60" width="400" height="140" rx="12" fill="#2a2214" stroke="#8a6418" stroke-width="2"/><text x="516" y="88" font-size="18" fill="#ffb733" font-weight="650" text-anchor="start">Unterrichts-Schnittstellen</text><text x="516" y="114" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Klausuren, Aufgaben, Ergebnisse;</text><text x="516" y="135" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Admin-Konten werden abgelehnt</text><text x="516" y="156" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">(403 ERR_TEACHER_ROLE_REQUIRED)</text><path d="M454,150 L496,150" fill="none" stroke="#ff9e94" stroke-width="2.4" marker-end="url(#aff9e94)"/><text x="475.0" y="140" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">403</text><path d="M946,150 L904,150" fill="none" stroke="#2ee6b0" stroke-width="2.4" marker-end="url(#a2ee6b0)"/><path d="M454,310 L496,310" fill="none" stroke="#ff9e94" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#aff9e94)"/><text x="475" y="345" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">nur Chiffrat</text><path d="M700,202 L700,236" fill="none" stroke="#c9d1da" stroke-width="2.4" marker-end="url(#ac9d1da)"/></svg>
