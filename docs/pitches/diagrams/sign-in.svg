t-weight="700" text-anchor="middle">3</text><path d="M1077.3333333333333,210 L658.0,210" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="866.6666666666666" y="200" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">erst jetzt: welche Faktoren fehlen; Einmal-Token, 10 Minuten</text><circle cx="26" cy="245" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="250" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">4</text><path d="M222.66666666666666,256 L642.0,256" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="433.3333333333333" y="246" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">zweiter Faktor (Authenticator-Code oder Passkey)</text><circle cx="26" cy="291" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="296" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">5</text><path d="M656.0,302 L1075.3333333333333,302" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="866.6666666666666" y="292" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">zweiten Faktor gegen das Konto im Token prüfen</text><circle cx="26" cy="337" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="342" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">6</text><path d="M1077.3333333333333,348 L658.0,348" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="866.6666666666666" y="338" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Sitzung + verpackter Datenschlüssel (Chiffrat)</text><circle cx="26" cy=