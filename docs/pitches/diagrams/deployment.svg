ht="700" text-anchor="start">GERÄT DER LEHRKRAFT</text><rect x="34" y="56" width="282" height="200" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="50" y="84" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Browser</text><text x="50" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Svelte-App, läuft vollständig</text><text x="50" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">lokal: Verschlüsselung,</text><text x="50" y="152" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">LaTeX (WASM), QR, MC-</text><text x="50" y="173" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Erkennung, Statistik</text><rect x="34" y="280" width="282" height="120" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="50" y="308" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">IndexedDB</text><text x="50" y="334" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Hybrid: Ergebnisse</text><text x="50" y="355" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">verschlüsselt</text><rect x="400" y="40" width="300" height="120" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="416" y="68" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Statisches Hosting</text><text x="416" y="94" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">liefert nur die App-Dateien</text><text x="416" y="115" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">(z. B. CDN oder Schulserver)</text><rect x="760" y="10" width="630" height="410" rx="16" fill="none" stroke="#6b7785" stroke-width="2" stroke-dasharray="8 6"/><text x="776" y="36" font-size="15" fill="#c9d1da" font-weight="700" text-anchor="start">SERVER · Docker Compose</text><rect x="784" y="56" width="240" height="110" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="800" y="84" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Caddy</text><text x="800" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">TLS, Reverse Proxy</text><rect x="1100" y="56" width="266" height="140" rx="12" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="1116" y="84" font-size="18" fill="#9cc8f0" font-weight="650" text-anchor="start">FastAPI-Backend</text><text x="1116" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">REST /api/v1;</text><text x="1116" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">optional Tectonic</text><rect x="784" y="230" width="240" height="120" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="800" y="258" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">PostgreSQL</text><text x="800" y="284" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Chiffrat + Bibliothek,</text><text x="800" y="305" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">keine offenen Ports</text><rect x="1100" y="230" width="266" height="120" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="1116" y="258" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Redis</text><text x="1116" y="284" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Anmeldesperren, Zähler</text><text x="1116" y="305" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">(kurzlebig); keine offenen Ports</text><text x="784" y="396" font-size="15" fill="#c9d1da" font-weight="500" text-anchor="start">+ täglicher Aufbewahrungslauf löscht abgelaufene Daten</text><path d="M318,110 L396,100" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="357.0" y="92" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">App laden</text><path d="M3