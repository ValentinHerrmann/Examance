<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif"><defs><marker id="ac9d1da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1da"/></marker><marker id="sc9d1da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9d1da"/></marker><marker id="aff9e94" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9e94"/></marker><marker id="sff9e94" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ff9e94"/></marker><marker id="affb733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffb733"/></marker><marker id="sffb733" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ffb733"/></marker><marker id="a2ee6b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ee6b0"/></marker><marker id="s2ee6b0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2ee6b0"/></marker><marker id="a9cc8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9cc8f0"/></marker><marker id="s9cc8f0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9cc8f0"/></marker></defs><rect width="1400" height="600" rx="16" fill="#16191d"/><rect x="10" y="10" width="960" height="580" rx="16" fill="none" stroke="#1d8a66" stroke-width="2" stroke-dasharray="8 6"/><text x="26" y="36" font-size="15" fill="#2ee6b0" font-weight="700" text-anchor="start">BROWSER DER LEHRKRAFT – hier entstehen und leben alle Schlüssel</text><rect x="1000" y="10" width="390" height="580" rx="16" fill="none" stroke="#6b7785" stroke-width="2" stroke-dasharray="8 6"/><text x="1016" y="36" font-size="15" fill="#c9d1da" font-weight="700" text-anchor="start">SERVER – speichert nur Chiffrat</text><rect x="34" y="56" width="270" height="78" rx="12" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="50" y="84" font-size="18" fill="#9cc8f0" font-weight="650" text-anchor="start">Passwort</text><text x="50" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Argon2id + HKDF</text><rect x="34" y="148" width="270" height="78" rx="12" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="50" y="176" font-size="18" fill="#9cc8f0" font-weight="650" text-anchor="start">Passkey</text><text x="50" y="202" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">PRF-Erweiterung + HKDF</text><rect x="34" y="240" width="270" height="78" rx="12" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="50" y="268" font-size="18" fill="#9cc8f0" font-weight="650" text-anchor="start">Wiederherstellungscode</text><text x="50" y="294" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">auf Papier · Argon2id + HKDF</text><rect x="360" y="56" width="262" height="262" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="376" y="84" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Je Faktor ein KEK</text><text x="376" y="110" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Schlüssel-Verschlüs-</text><text x="376" y="131" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">selungsschlüssel</text><text x="376" y="152" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start"></text><text x="376" y="173" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Argon2id: t=3, 64 MB,</text><text x="376" y="194" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">p=4, eigener Salt</text><text x="376" y="215" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">je Faktor</text><path d="M306,95 L356,95" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M306,187 L356,187" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M306,279 L356,279" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><rect x="700" y="110" width="250" height="150" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="716" y="138" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Datenschlüssel</text><text x="716" y="164" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">zufällige 32 Byte,</text><text x="716" y="185" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">je Faktor einmal</text><text x="716" y="206" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">verpackt (AES-GCM)</text><path d="M624,185 L696,185" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="660.0" y="172" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(ent)packt</text><rect x="1024" y="96" width="342" height="178" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="1040" y="124" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Schlüsselverpackungen</text><text x="1040" y="150" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">je Faktor: verpackter</text><text x="1040" y="171" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Datenschlüssel, Salt,</text><text x="1040" y="192" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">KDF-Parameter; an Konto</text><text x="1040" y="213" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">und Faktor gebunden</text><path d="M952,160 L1020,160" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="986.0" y="150" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">speichern</text><path d="M1020,215 L952,215" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="986.0" y="238" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">laden</text><rect x="34" y="380" width="250" height="130" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="50" y="408" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="start">Sitzungs-Nonce</text><text x="50" y="434" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">aus der E-Mail-Adresse</text><text x="50" y="455" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">abgeleitet (kein</text><text x="50" y="476" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Geheimnis, nur Salt)</text><rect x="340" y="380" width="280" height="130" rx="12" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="356" y="408" font-size="18" fill="#9cc8f0" font-weight="650" text-anchor="start">Sitzungsschlüssel</text><text x="356" y="434" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">HKDF-SHA-256; lebt nur</text><text x="356" y="455" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">in diesem Tab, gelöscht</text><text x="356" y="476" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">bei Sperre und Inaktivität</text><rect x="680" y="380" width="270" height="130" rx="12" fill="#1a2530" stroke="#4f7aa3" stroke-width="2"/><text x="696" y="408" font-size="18" fill="#9cc8f0" font-weight="650" text-anchor="start">AES-256-GCM</text><text x="696" y="434" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">frischer 12-Byte-IV</text><text x="696" y="455" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">pro Vorgang</text><path d="M825,262 L825,340 L480,340 L480,376" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M286,445 L336,445" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><path d="M622,445 L676,445" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><rect x="1024" y="360" width="342" height="170" rx="12" fill="#12271f" stroke="#1d8a66" stroke-width="2"/><text x="1040" y="388" font-size="18" fill="#2ee6b0" font-weight="650" text-anchor="start">Datensätze</text><text x="1040" y="414" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Namen, Scans, Anmerkungen,</text><text x="1040" y="435" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">Einzelpunkte, MC-Daten:</text><text x="1040" y="456" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">nur als Chiffrat (Hybrid:</text><text x="1040" y="477" font-size="15" fill="#c9d1da" font-weight="400" text-anchor="start">nur in IndexedDB)</text><path d="M952,445 L1020,445" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="986.0" y="435" font-size="14" fill="#c9d1da" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Chiffrat</text><text x="500" y="568" font-size="15" fill="#ffb733" font-weight="600" text-anchor="middle">Passwort-Reset durch Admin: Die Passwort-Verpackung wird ungültig, nur der Wiederherstellungscode öffnet die Daten wieder.</text></svg>
