 font-weight="650" text-anchor="middle">Browser der Lehrkraft</text><line x1="216.66666666666666" y1="66" x2="216.66666666666666" y2="528" stroke="#6b7785" stroke-width="2" stroke-dasharray="4 5"/><rect x="520.0" y="20" width="260" height="46" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="650.0" y="48" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="middle">Papier und Kopierer</text><line x1="650.0" y1="66" x2="650.0" y2="528" stroke="#6b7785" stroke-width="2" stroke-dasharray="4 5"/><rect x="953.3333333333333" y="20" width="260" height="46" rx="12" fill="#1c2128" stroke="#6b7785" stroke-width="2"/><text x="1083.3333333333333" y="48" font-size="18" fill="#f4f6f8" font-weight="650" text-anchor="middle">Server</text><line x1="1083.3333333333333" y1="66" x2="1083.3333333333333" y2="528" stroke="#6b7785" stroke-width="2" stroke-dasharray="4 5"/><circle cx="26" cy="107" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="112" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">1</text><rect x="208.66666666666666" y="92" width="16" height="30" rx="3" fill="#1a2530" stroke="#4f7aa3"/><text x="234.66666666666666" y="112" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="start" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Schülerliste: je Person ein zufälliges Pseudonym</text><circle cx="26" cy="153" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="158" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">2</text><path d="M222.66666666666666,164 L1075.3333333333333,164" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="650.0" y="154" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Name, Nummer verschlüsselt; Kennung je Klausur geschlüsselt (HMAC)</text><circle cx="26" cy="199" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="204" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">3</text><path d="M222.66666666666666,210 L642.0,210" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="433.3333333333333" y="200" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Klausur-PDF: QR mit Pseudonym, Variante, Ersatzcode</text><circle cx="26" cy="245" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="250" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">4</text><path d="M644.0,256 L224.66666666666666,256" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="433.3333333333333" y="246" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">ein Scan-PDF für den ganzen Stapel</text><circle cx="26" cy="291" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="296" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">5</text><rect x="208.66666666666666" y="276" width="16" height="30" rx="3" fill="#1a2530" stroke="#4f7aa3"/><text x="234.66666666666666" y="296" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="start" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">QR lesen, Seiten zuordnen, Kreuze messen (Web Worker)</text><circle cx="26" cy="337" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="342" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">6</text><rect x="208.66666666666666" y="322" width="16" height="30" rx="3" fill="#1a2530" stroke="#4f7aa3"/><text x="234.66666666666666" y="342" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="start" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">korrigieren: „Anonymer Schüler #7 von 26“</text><circle cx="26" cy="383" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="388" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">7</text><path d="M222.66666666666666,394 L1075.3333333333333,394" fill="none" stroke="#9cc8f0" stroke-width="2.4" marker-end="url(#a9cc8f0)"/><text x="650.0" y="384" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="middle" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Scan, Anmerkungen, Einzelpunkte als Chiffrat; Gesamtpunktzahl</text><circle cx="26" cy="429" r="12" fill="#1a2530" stroke="#4f7aa3"/><text x="26" y="434" font-size="13" fill="#9cc8f0" font-weight="700" text-anchor="middle">8</text><rect x="208.66666666666666" y="414" width="16" height="30" rx="3" fill="#1a2530" stroke="#4f7aa3"/><text x="234.66666666666666" y="434" font-size="15" fill="#f4f6f8" font-weight="500" text-anchor="start" stroke="#16191d" stroke-width="6" paint-order="stroke" stroke-linejoin="round">danach: Namen im Browser entschlüsseln und zuordnen</text><rect x="96.66666666666666" y="456" width="1106.6666666666665" height="50" rx="10" fill="#2a2214" stroke="#8a6418" stroke-width="1.5"/><text x="650.0" y="485" font-size="16" fill="#ffb733" font-weight="600" text-anchor="middle">Pseudonym ist nicht anonym: Wer den Schlüssel hat, kann zuordnen – die DSGVO gilt voll</text></svg>
