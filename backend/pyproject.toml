[project]
name = "blindgrade-backend"
version = "0.1.0"
description = "BlindGrade backend API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",            # PostgreSQL async driver
    "psycopg2-binary>=2.9.0",     # Alembic env sync fallback
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",               # Redis-backed rate limiting in prod
    "click>=8.1.0",               # CLI management commands
    "cryptography>=42.0.0",       # AES-GCM for TOTP secrets at rest
    "httpx>=0.27.0",              # For tests / internal HTTP calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-redis",
    "aiosqlite>=0.20.0",    # In-memory SQLite for unit/integration tests
    "httpx>=0.27.0",        # AsyncClient for FastAPI test transport
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S = flake8-bandit (security), B = flake8-bugbear. Both are load-bearing here:
# see CLAUDE.md — lint is treated as a security control, not a style preference.
select = ["E", "F", "I", "UP", "S", "B"]

ignore = [
    # B008: "Do not perform function call in argument defaults". This is
    # FastAPI's documented dependency-injection idiom — `x = Depends(f)` in a
    # signature is how the framework is meant to be used, and the value is
    # resolved per-request by FastAPI rather than once at import. Rewriting
    # every route to `Annotated[X, Depends(f)]` would touch every endpoint for
    # no behavioural gain. Bugbear's other checks stay enabled.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest expresses every assertion with `assert`.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
