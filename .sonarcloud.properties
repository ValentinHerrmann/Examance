# SonarCloud automatic analysis settings.
# The de/en i18n catalogs mirror each other key for key by design (en is typed against de), and the
# LaTeX quick-insert catalogs (general and subject snippets) are tables of same-shaped entries. Sonar's copy-paste detection ignores
# string literals and would report both as duplicates.
sonar.cpd.exclusions=frontend/src/lib/i18n/**,frontend/src/lib/latex/quickInsertMacros.ts,frontend/src/lib/latex/subjectSnippets.ts
# Throwaway passwords of the local screenshot instance (docs/demo-instance); JSON cannot carry a NOSONAR comment.
sonar.exclusions=docs/demo-instance/data/**
