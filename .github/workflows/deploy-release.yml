name: Deploy Release

# Publishing a GitHub Release ships production; the version comes from the tag.
# `published`, not `created`: `created` also fires on draft-save and would deploy unfinished releases.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, e.g. 1.4.0 (no leading v)"
        required: true
        type: string

# Never interrupt a production deploy midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: examance-backend

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate semantic version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$TAG_NAME"
          else
            RAW="$INPUT_VERSION"
          fi
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: '$RAW' is not [major].[minor].[patch]" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version $VERSION"

  frontend:
    name: Publish frontend to release branch
    needs: version
    runs-on: ubuntu-latest
    # Covers the Cloudflare Pages build this job waits for, not just the push.
    timeout-minutes: 20
    permissions:
      contents: write
      # Read Cloudflare Pages' check run on the pushed commit.
      checks: read
    environment:
      name: production
      # The Cloudflare Pages deployment that went live (dashboard link);
      # the site itself if the wait step never got that far.
      url: ${{ steps.pages.outputs.url || 'https://examance.valentin-herrmann.com/' }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Write VERSION and publish to the release branch
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Via env, never interpolated into the script: the body is free text.
          RELEASE_BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf '%s\n' "$VERSION" > VERSION

          # The in-app "what's new" notice inlines these at build time (frontend/vite.config.ts).
          # A manual dispatch has no event body, so read it from the published release (may not exist yet).
          if [ -z "$RELEASE_BODY" ] && [ "${{ github.event_name }}" != "release" ]; then
            RELEASE_BODY="$(gh release view "v$VERSION" --json body --jq .body 2>/dev/null || gh release view "$VERSION" --json body --jq .body 2>/dev/null || true)"
          fi
          printf '%s\n' "$RELEASE_BODY" > RELEASE_NOTES.md
          git add VERSION RELEASE_NOTES.md

          # The commit that lands on the default branch carries [skip ci] so it
          # does not re-trigger the CI workflow...
          git commit -m "chore: release $VERSION [skip ci]" --allow-empty
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

          # ...but the copy pushed to `release` must NOT, or Cloudflare Pages
          # skips the production build.
          git commit --allow-empty --amend -m "chore: release $VERSION"
          git push origin HEAD:refs/heads/release --force 

      # Cloudflare Pages builds `release` on its own; without this the run
      # would report success while the frontend is still building (or failed).
      - name: Wait for Cloudflare Pages deployment
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/wait-for-cloudflare-pages.sh "$(git rev-parse HEAD)"

  backend-image:
    name: Build backend image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Compute image reference
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "image=${BASE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

  # Starts with `version`, not after the image build: the maintenance warning (issue #130) runs
  # while the image builds, so only the restart itself is downtime. See docs/deployment.md.
  backend-deploy:
    name: Deploy backend (production)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Lets this job's own GITHUB_TOKEN pull from GHCR — each job mints its
      # own token, valid for that job's duration, so no long-lived PAT is
      # needed just to let the server authenticate during this run.
      packages: read
      # Waits for the "Build backend image" job of this run.
      actions: read
    environment:
      name: production
      url: ${{ vars.BACKEND_PUBLIC_URL || 'https://api-examance.valentin-herrmann.com/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Same reference the backend-image job pushes.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"

      # Teachers get 5 minutes' warning (2nd reminder 1 minute before). Prints the window's
      # revision; without one (first deploy of the feature, no stack yet) the deploy runs as before.
      - name: Announce maintenance
        id: announce
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_APP_DIR
          capture_stdout: true
          script: |
            set -eu
            cd "${DEPLOY_APP_DIR:?}/prod" 2>/dev/null || { echo "No stack yet."; exit 0; }
            COMPOSE="docker compose -p examance-prod -f docker-compose.deploy.yml --env-file .env"
            REV=$($COMPOSE exec -T backend python -m app.cli maintenance start \
              --kind deployment --lead-seconds 300 --second-warning-seconds 60 --class very_short \
              | tail -n1) || REV=""
            echo "MAINTENANCE_REVISION=${REV}"

      - name: Read maintenance revision
        id: maint
        env:
          STDOUT: ${{ steps.announce.outputs.stdout }}
        run: |
          REV=$(printf '%s\n' "$STDOUT" | sed -n 's/^MAINTENANCE_REVISION=\([0-9][0-9]*\)$/\1/p' | tail -n1)
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "Maintenance window: ${REV:-none}"

      - name: Wait for the backend image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 270); do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --jq '.jobs[] | select(.name == "Build backend image") | "\(.status) \(.conclusion)"' | head -n1)
            case "$STATE" in
              "completed success") echo "Image built."; exit 0 ;;
              completed*) echo "ERROR: image build ended as '${STATE}'." >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "ERROR: image build did not finish within 45 minutes." >&2
          exit 1

      # The compose file travels inside the SSH step (base64 in an env var)
      # instead of a separate scp-action step: one connection instead of two,
      # and no Docker-based action to build before the job can start.
      - name: Encode compose file
        id: compose
        run: |
          echo "b64=$(base64 -w0 deploy/docker-compose.deploy.yml)" >> "$GITHUB_OUTPUT"
          echo "restore_b64=$(base64 -w0 deploy/restore-backup.sh)" >> "$GITHUB_OUTPUT"

      - name: Pull image, back up, migrate and restart
        # v1 is a composite action (prebuilt binary); v0.1.x was Docker-based
        # and spent its first ~20s building a container image.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.image }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          REGISTRY_USER: ${{ github.actor }}
          # This job's own GITHUB_TOKEN, not a stored secret — minted at job
          # start, valid only for this run, revoked automatically afterwards.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          RESTORE_B64: ${{ steps.compose.outputs.restore_b64 }}
          MAINTENANCE_REVISION: ${{ steps.maint.outputs.revision }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          # Includes waiting out the announced warning and the maintenance backup.
          command_timeout: 40m
          envs: BACKEND_IMAGE,APP_VERSION,DEPLOY_APP_DIR,REGISTRY_USER,REGISTRY_TOKEN,COMPOSE_B64,RESTORE_B64,MAINTENANCE_REVISION
          script: |
            set -euo pipefail

            # `set -u` does not catch this: the variable is set, just empty,
            # which would silently make the target "/prod".
            if [ -z "${DEPLOY_APP_DIR:-}" ]; then
              echo "ERROR: DEPLOY_APP_DIR is empty." >&2
              echo "Set it under Settings -> Environments -> production -> Variables." >&2
              exit 1
            fi

            TARGET="${DEPLOY_APP_DIR}/prod"
            mkdir -p "$TARGET"
            cd "$TARGET"

            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.deploy.yml.tmp
            mv docker-compose.deploy.yml.tmp docker-compose.deploy.yml
            # Restore helper for the restic backup (docs/dev/storage_partitions.md).
            printf '%s' "$RESTORE_B64" | base64 -d > restore-backup.sh.tmp
            chmod 700 restore-backup.sh.tmp && mv restore-backup.sh.tmp restore-backup.sh

            # The env file holds this environment's SECRET_KEY and database
            # password, so it is created once by hand and never by CI.
            if [ ! -f .env ]; then
              echo "ERROR: ${TARGET}/.env not found on the server." >&2
              echo "Create it from deploy/env.prod.example — see docs/deployment.md section 6." >&2
              exit 1
            fi

            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

            # Record the image this environment runs, so a bare `compose up` on
            # the server reproduces exactly what CI deployed.
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
            grep -q '^BACKEND_IMAGE=' .env || echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env

            COMPOSE="docker compose -p examance-prod -f docker-compose.deploy.yml --env-file .env"

            $COMPOSE pull
            if [ -n "${MAINTENANCE_REVISION:-}" ]; then
              # Waits for the announced start, stops teaching writes, then for the database
              # backup of the maintenance-backup service. Any failure aborts before migrating.
              # The new image's CLI is the fallback when the running one fails (a CLI bug must not
              # block every later deploy); a real failure fails again and still aborts.
              NEW_CLI="$COMPOSE --profile tools run --rm --no-deps -T migrate python -m app.cli"
              $COMPOSE exec -T backend python -m app.cli maintenance freeze --wait \
                --revision "$MAINTENANCE_REVISION" \
                || $NEW_CLI maintenance freeze --wait --revision "$MAINTENANCE_REVISION"
              $COMPOSE exec -T backend python -m app.cli maintenance wait-backup \
                --revision "$MAINTENANCE_REVISION" --timeout 900 \
                || $NEW_CLI maintenance wait-backup --revision "$MAINTENANCE_REVISION" --timeout 900
            fi
            # Migrations run forward only. A rollback to an older image does NOT
            # undo them — see docs/deployment.md.
            $COMPOSE --profile tools run --rm migrate
            $COMPOSE up -d --remove-orphans

            APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2)
            APP_PORT="${APP_PORT:-8000}"
            for i in $(seq 1 30); do
              REPORTED=$(curl -sf "http://127.0.0.1:${APP_PORT}/api/health" \
                | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
              if [ "$REPORTED" = "$APP_VERSION" ]; then
                echo "Healthy on $APP_VERSION"
                # New cache volumes are seeded from the image; this tops up an older one (issue #75).
                # Seconds when warm; bounded and non-fatal, a cold remainder only slows first compiles.
                timeout 300 $COMPOSE exec -T backend sh /app/latex-warmup/warmup.sh \
                  || echo "WARNING: Tectonic cache warm-up did not finish; first LaTeX previews may be slow." >&2
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: backend did not report version ${APP_VERSION} within 60s (last: '${REPORTED:-none}')" >&2
            $COMPOSE logs --tail 200 backend >&2
            exit 1

      # Also after a failure or cancellation; a window of a newer run is left alone.
      - name: End maintenance
        if: always() && steps.maint.outputs.revision != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          MAINTENANCE_REVISION: ${{ steps.maint.outputs.revision }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_APP_DIR,MAINTENANCE_REVISION
          script: |
            set -eu
            cd "${DEPLOY_APP_DIR:?}/prod"
            COMPOSE="docker compose -p examance-prod -f docker-compose.deploy.yml --env-file .env"
            $COMPOSE exec -T backend python -m app.cli maintenance stop \
              --revision "$MAINTENANCE_REVISION" \
              || echo "WARNING: could not end maintenance; it ends by itself 15 minutes after the freeze." >&2
