name: Deploy Preview

# Every non-draft pull request — and every push to one — redeploys the shared
# preview instance. Draft PRs deploy nothing. A direct push to main (e.g. a
# merge) redeploys it too, versioned with the short commit hash instead of a
# PR number.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# There is one preview instance, so a newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-preview
  cancel-in-progress: true

env:
  IMAGE_NAME: examance-backend

jobs:
  version:
    name: Resolve preview version
    # Fork PRs are excluded: the deploy jobs need repository secrets, and a
    # fork's head is untrusted code. `push` only ever fires for pushes to
    # this repository, never a fork's, so it needs no such guard.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Push-to-main builds have no PR number, so they're tagged with the
      # short commit hash instead (<latest-release>-<sha7> [<built-at>]).
      - name: Compose <latest-release>-PR#<number>|<sha7> [<built-at>]
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BASE=$(tr -d ' \t\r\n' < VERSION)
          if [ -z "$BASE" ]; then
            echo "ERROR: VERSION file is empty" >&2
            exit 1
          fi
          BUILT_AT=$(date -u +'%d.%m.%Y | %H:%M')
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${BASE}-${HEAD_SHA:0:7} [${BUILT_AT}]"
          else
            VERSION="${BASE}-PR#${PR_NUMBER} [${BUILT_AT}]"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Preview version ${VERSION}"

  frontend:
    name: Publish frontend to preview branch
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: preview
      url: https://prev-examance.valentin-herrmann.com/
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # Cloudflare Pages builds only `preview` and has no notion of PR numbers,
      # so the version string computed above is stamped into a file the build
      # reads directly (see readPreviewVersionFile() in vite.config.ts) for the
      # version display and PR linking.
      - name: Stamp preview version file
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$VERSION" > PREVIEW_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PREVIEW_VERSION
          git commit -m "chore: stamp preview version ${VERSION}" --quiet

      - name: Force-push to preview branch
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/preview --force

  backend-image:
    name: Build backend image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Compute image reference
        id: meta
        env:
          HEAD_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          # Deploy the immutable sha tag; :preview is a convenience pointer.
          echo "image=${BASE}:sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "moving=${BASE}:preview" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.moving }}

  backend-deploy:
    name: Deploy backend (preview)
    needs: [version, backend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets this job's own GITHUB_TOKEN pull from GHCR — each job mints its
      # own token, valid for that job's duration, so no long-lived PAT is
      # needed just to let the server authenticate during this run.
      packages: read
    environment:
      name: preview
      url: ${{ vars.BACKEND_PUBLIC_URL || 'https://prev-api-examance.valentin-herrmann.com/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: deploy/docker-compose.deploy.yml
          target: ${{ vars.DEPLOY_APP_DIR }}/preview
          strip_components: 1

      - name: Pull image, migrate and restart
        uses: appleboy/ssh-action@v0.1.7
        env:
          BACKEND_IMAGE: ${{ needs.backend-image.outputs.image }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          REGISTRY_USER: ${{ github.actor }}
          # This job's own GITHUB_TOKEN, not a stored secret — minted at job
          # start, valid only for this run, revoked automatically afterwards.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: BACKEND_IMAGE,APP_VERSION,DEPLOY_APP_DIR,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail

            # `set -u` does not catch this: the variable is set, just empty,
            # which would silently make the target "/preview".
            if [ -z "${DEPLOY_APP_DIR:-}" ]; then
              echo "ERROR: DEPLOY_APP_DIR is empty." >&2
              echo "Set it under Settings -> Environments -> preview -> Variables." >&2
              exit 1
            fi

            TARGET="${DEPLOY_APP_DIR}/preview"
            cd "$TARGET"

            # The env file holds this environment's SECRET_KEY and database
            # password, so it is created once by hand and never by CI.
            if [ ! -f .env ]; then
              echo "ERROR: ${TARGET}/.env not found on the server." >&2
              echo "Create it from deploy/env.preview.example — see docs/deployment.md section 6." >&2
              exit 1
            fi

            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
            grep -q '^BACKEND_IMAGE=' .env || echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env

            COMPOSE="docker compose -p examance-preview -f docker-compose.deploy.yml --env-file .env"

            $COMPOSE pull
            $COMPOSE --profile tools run --rm migrate
            $COMPOSE up -d --remove-orphans

            APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2)
            APP_PORT="${APP_PORT:-8001}"
            for i in $(seq 1 30); do
              REPORTED=$(curl -sf "http://127.0.0.1:${APP_PORT}/api/health" \
                | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
              if [ "$REPORTED" = "$APP_VERSION" ]; then
                echo "Healthy on $APP_VERSION"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: backend did not report version ${APP_VERSION} within 60s (last: '${REPORTED:-none}')" >&2
            $COMPOSE logs --tail 200 backend >&2
            exit 1
