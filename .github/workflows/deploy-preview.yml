name: Deploy Preview

# Every non-draft PR (and push to one) redeploys the shared preview; drafts deploy nothing.
# A push to main redeploys it too, versioned with the short commit hash.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Newer pushes queue behind a running deploy (only the newest pending run is kept), so a deploy is
# never cancelled mid-freeze or mid-migration. Runs that deploy nothing get their own group.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.pull_request.draft ||
         github.event.pull_request.head.repo.full_name != github.repository) &&
        format('deploy-preview-skip-{0}', github.run_id) || 'deploy-preview' }}
  cancel-in-progress: false

env:
  IMAGE_NAME: examance-backend

jobs:
  version:
    name: Resolve preview version
    # Fork PRs are excluded: the deploy jobs need repository secrets, and a
    # fork's head is untrusted code. `push` only ever fires for pushes to
    # this repository, never a fork's, so it needs no such guard.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read Cloudflare Pages' check run on the currently deployed commit.
      checks: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Push-to-main builds have no PR number, so they're tagged with the
      # short commit hash instead (<latest-release>-<sha7> [<built-at>]).
      - name: Compose <latest-release>-PR#<number>|<sha7> [<built-at>]
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'manual' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BASE=$(tr -d ' \t\r\n' < VERSION)
          if [ -z "$BASE" ]; then
            echo "ERROR: VERSION file is empty" >&2
            exit 1
          fi
          BUILT_AT=$(TZ='Europe/Berlin' date +'%d.%m.%Y | %H:%M')
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${BASE}-${HEAD_SHA:0:7} [${BUILT_AT}]"
          else
            VERSION="${BASE}-PR#${PR_NUMBER} [${BUILT_AT}]"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Preview version ${VERSION}"

      # PRs redeploy only the changed side, diffed against what the preview runs *now* (`preview`
      # branch, `preview-backend` marker), never the PR's previous push. A side is kept only if
      # deployed from this same <release>-PR#<n>; main pushes and manual runs deploy both.
      - name: Decide which sides to deploy
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BACKEND_URL: ${{ vars.BACKEND_PUBLIC_URL || 'https://prev-api-examance.valentin-herrmann.com/' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FRONTEND=true
          BACKEND=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PREFIX="${VERSION% \[*}"
            SHARED=(.github/workflows/deploy-preview.yml .github/scripts)

            # Frontend: same PR, unchanged files, and Cloudflare's build of it
            # succeeded (a failed or cancelled Pages build must be retried).
            if git fetch -q --no-tags --depth=1 origin preview 2>/dev/null; then
              DEPLOYED_SHA=$(git rev-parse FETCH_HEAD)
              DEPLOYED=$(git show FETCH_HEAD:PREVIEW_VERSION 2>/dev/null || true)
              PAGES=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYED_SHA}/check-runs" \
                --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")]
                      | sort_by(.started_at) | last | .conclusion // empty' 2>/dev/null || true)
              if [ "${DEPLOYED% \[*}" = "$PREFIX" ] && [ "$PAGES" = "success" ] \
                 && git diff --quiet FETCH_HEAD HEAD -- frontend VERSION "${SHARED[@]}"; then
                FRONTEND=false
              fi
            fi

            # Backend: the running server reports this PR, and nothing it is
            # built from changed since the last healthy deploy.
            DEPLOYED=$(curl -sf --max-time 10 "${BACKEND_URL%/}/api/health" | jq -r '.version // empty' || true)
            if [ "${DEPLOYED% \[*}" = "$PREFIX" ] \
               && git fetch -q --no-tags --depth=1 origin preview-backend 2>/dev/null \
               && git diff --quiet FETCH_HEAD HEAD -- backend deploy "${SHARED[@]}"; then
              BACKEND=false
            fi
          fi
          echo "frontend=${FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
          echo "Deploy frontend: ${FRONTEND}, backend: ${BACKEND}"

  frontend:
    name: Publish frontend to preview branch
    needs: version
    if: needs.version.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Covers the Cloudflare Pages build this job waits for, not just the push.
    timeout-minutes: 20
    permissions:
      contents: write
      # Read Cloudflare Pages' check run on the pushed commit.
      checks: read
    environment:
      name: preview
      # The Cloudflare Pages deployment that went live (dashboard link);
      # the site itself if the wait step never got that far.
      url: ${{ steps.pages.outputs.url || 'https://prev-examance.valentin-herrmann.com/' }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # Cloudflare Pages knows no PR numbers, so the version is stamped into a file the build
      # reads (readPreviewVersionFile() in vite.config.ts).
      - name: Stamp preview version file
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s' "$VERSION" > PREVIEW_VERSION
          # Preview "what's new" notice (UpdateNotice.svelte) shows the PR title; markup characters are stripped
          # so a title cannot inject links. Non-PR runs get an empty file, i.e. no notice.
          if [ -n "$PR_TITLE" ]; then
            printf '## %s\n' "$(printf '%s' "$PR_TITLE" | tr -d '[]*`')" > RELEASE_NOTES.md
          else
            : > RELEASE_NOTES.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PREVIEW_VERSION RELEASE_NOTES.md
          git commit -m "chore: stamp preview version ${VERSION}" --quiet

      - name: Force-push to preview branch
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/preview --force

      # Cloudflare Pages builds `preview` on its own; without this the run
      # would report success while the frontend is still building (or failed).
      - name: Wait for Cloudflare Pages deployment
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/wait-for-cloudflare-pages.sh "$(git rev-parse HEAD)"

  backend-image:
    name: Build backend image
    needs: version
    if: needs.version.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Compute image reference
        id: meta
        env:
          HEAD_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER}/${IMAGE_NAME}"
          # Deploy the immutable sha tag; :preview is a convenience pointer.
          echo "image=${BASE}:sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "moving=${BASE}:preview" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.moving }}

  # Starts with `version`, not after the image build: the maintenance warning (issue #130) runs
  # while the image builds, so only the restart itself is downtime. See docs/deployment.md.
  backend-deploy:
    name: Deploy backend (preview)
    needs: version
    if: needs.version.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Moves the preview-backend marker after a healthy deploy.
      contents: write
      # Lets this job's own GITHUB_TOKEN pull from GHCR — each job mints its
      # own token, valid for that job's duration, so no long-lived PAT is
      # needed just to let the server authenticate during this run.
      packages: read
      # Waits for the "Build backend image" job of this run.
      actions: read
    environment:
      name: preview
      url: ${{ vars.BACKEND_PUBLIC_URL || 'https://prev-api-examance.valentin-herrmann.com/' }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Compute image reference
        id: meta
        env:
          HEAD_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          # Same immutable tag the backend-image job pushes.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}:sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      # Waits (25 min max) for an open manual or frozen window to end, then prints the revision;
      # none (no CLI yet, no stack) deploys without a window. docs/dev/maintenance_mode.md
      - name: Announce maintenance
        id: announce
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_APP_DIR
          capture_stdout: true
          command_timeout: 30m
          script: |
            set -eu
            cd "${DEPLOY_APP_DIR:?}/preview" 2>/dev/null || { echo "No stack yet."; exit 0; }
            COMPOSE="docker compose -p examance-preview -f docker-compose.deploy.yml --env-file .env"
            START="$COMPOSE exec -T backend python -m app.cli maintenance start --kind deployment --lead-seconds 30 --second-warning-seconds 10 --class very_short"
            RC=0; OUT=$($START --wait-free 1500 2>&1) || RC=$?
            if [ "$RC" = 75 ]; then echo "$OUT" >&2; echo "MAINTENANCE_BUSY=1"; exit 1; fi
            # A running image older than --wait-free: announce without waiting.
            if [ "$RC" != 0 ] && echo "$OUT" | grep -q "No such option"; then
              RC=0; OUT=$($START 2>&1) || RC=$?
            fi
            [ "$RC" = 0 ] || OUT=""
            echo "MAINTENANCE_REVISION=$(printf '%s\n' "$OUT" | tail -n1)"

      - name: Read maintenance revision
        id: maint
        env:
          STDOUT: ${{ steps.announce.outputs.stdout }}
        run: |
          REV=$(printf '%s\n' "$STDOUT" | sed -n 's/^MAINTENANCE_REVISION=\([0-9][0-9]*\)$/\1/p' | tail -n1)
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "Maintenance window: ${REV:-none}"

      - name: Wait for the backend image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # filter=all: a "Re-run failed jobs" attempt still sees the earlier successful build.
          for i in $(seq 1 90); do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" \
              --jq '[.jobs[] | select(.name == "Build backend image")] | sort_by([.run_attempt, (.started_at // "")]) | last
                | "\(.status) \(.conclusion)"' 2>/dev/null) || STATE=""
            case "$STATE" in
              "completed success") echo "Image built."; exit 0 ;;
              "completed "*) echo "ERROR: image build ended as '${STATE}'." >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "ERROR: image build did not finish within 15 minutes." >&2
          exit 1

      # The compose file travels inside the SSH step (base64 in an env var)
      # instead of a separate scp-action step: one connection instead of two,
      # and no Docker-based action to build before the job can start.
      - name: Encode compose file
        id: compose
        run: |
          echo "b64=$(base64 -w0 deploy/docker-compose.deploy.yml)" >> "$GITHUB_OUTPUT"
          echo "restore_b64=$(base64 -w0 deploy/restore-backup.sh)" >> "$GITHUB_OUTPUT"

      - name: Pull image, back up, migrate and restart
        # v1 is a composite action (prebuilt binary); v0.1.x was Docker-based
        # and spent its first ~20s building a container image.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.image }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          REGISTRY_USER: ${{ github.actor }}
          # This job's own GITHUB_TOKEN, not a stored secret — minted at job
          # start, valid only for this run, revoked automatically afterwards.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          RESTORE_B64: ${{ steps.compose.outputs.restore_b64 }}
          MAINTENANCE_REVISION: ${{ steps.maint.outputs.revision }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          # Includes waiting out the announced warning and the maintenance backup.
          command_timeout: 40m
          envs: BACKEND_IMAGE,APP_VERSION,DEPLOY_APP_DIR,REGISTRY_USER,REGISTRY_TOKEN,COMPOSE_B64,RESTORE_B64,MAINTENANCE_REVISION
          script: |
            set -euo pipefail

            # `set -u` does not catch this: the variable is set, just empty,
            # which would silently make the target "/preview".
            if [ -z "${DEPLOY_APP_DIR:-}" ]; then
              echo "ERROR: DEPLOY_APP_DIR is empty." >&2
              echo "Set it under Settings -> Environments -> preview -> Variables." >&2
              exit 1
            fi

            TARGET="${DEPLOY_APP_DIR}/preview"
            mkdir -p "$TARGET"
            cd "$TARGET"

            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.deploy.yml.tmp
            mv docker-compose.deploy.yml.tmp docker-compose.deploy.yml
            # Restore helper for the restic backup (docs/dev/storage_partitions.md).
            printf '%s' "$RESTORE_B64" | base64 -d > restore-backup.sh.tmp
            chmod 700 restore-backup.sh.tmp && mv restore-backup.sh.tmp restore-backup.sh

            # The env file holds this environment's SECRET_KEY and database
            # password, so it is created once by hand and never by CI.
            if [ ! -f .env ]; then
              echo "ERROR: ${TARGET}/.env not found on the server." >&2
              echo "Create it from deploy/env.preview.example — see docs/deployment.md section 6." >&2
              exit 1
            fi

            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
            grep -q '^BACKEND_IMAGE=' .env || echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env

            COMPOSE="docker compose -p examance-preview -f docker-compose.deploy.yml --env-file .env"

            $COMPOSE pull
            if [ -n "${MAINTENANCE_REVISION:-}" ]; then
              # Freeze, then wait for the maintenance backup; any failure aborts before migrating.
              # Fallback: the new image's CLI (docs/dev/maintenance_mode.md).
              NEW_CLI="$COMPOSE --profile tools run --rm --no-deps -T migrate python -m app.cli"
              $COMPOSE exec -T backend python -m app.cli maintenance freeze --wait \
                --revision "$MAINTENANCE_REVISION" \
                || $NEW_CLI maintenance freeze --wait --revision "$MAINTENANCE_REVISION"
              $COMPOSE exec -T backend python -m app.cli maintenance wait-backup \
                --revision "$MAINTENANCE_REVISION" --timeout 900 \
                || $NEW_CLI maintenance wait-backup --revision "$MAINTENANCE_REVISION" --timeout 900
            fi
            $COMPOSE --profile tools run --rm migrate
            $COMPOSE up -d --remove-orphans

            APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2)
            APP_PORT="${APP_PORT:-8001}"
            for i in $(seq 1 30); do
              REPORTED=$(curl -sf "http://127.0.0.1:${APP_PORT}/api/health" \
                | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') || true
              if [ "$REPORTED" = "$APP_VERSION" ]; then
                echo "Healthy on $APP_VERSION"
                # New cache volumes are seeded from the image; this tops up an older one (issue #75).
                # Seconds when warm; bounded and non-fatal, a cold remainder only slows first compiles.
                timeout 300 $COMPOSE exec -T backend sh /app/latex-warmup/warmup.sh \
                  || echo "WARNING: Tectonic cache warm-up did not finish; first LaTeX previews may be slow." >&2
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: backend did not report version ${APP_VERSION} within 60s (last: '${REPORTED:-none}')" >&2
            $COMPOSE logs --tail 200 backend >&2
            exit 1

      # Records which commit the preview backend now runs — the baseline the
      # next run's "Decide which sides to deploy" diffs against. Only reached
      # once the health check above saw the new version.
      - name: Mark deployed backend commit
        run: git push --force origin "HEAD:refs/heads/preview-backend"

      # Also after a failure or cancellation (a newer push cancels this run); a window of the
      # newer run is left alone.
      - name: End maintenance
        if: always() && steps.maint.outputs.revision != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          MAINTENANCE_REVISION: ${{ steps.maint.outputs.revision }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_APP_DIR,MAINTENANCE_REVISION
          script: |
            set -eu
            cd "${DEPLOY_APP_DIR:?}/preview"
            COMPOSE="docker compose -p examance-preview -f docker-compose.deploy.yml --env-file .env"
            $COMPOSE exec -T backend python -m app.cli maintenance stop \
              --revision "$MAINTENANCE_REVISION" \
              || echo "WARNING: could not end maintenance; it ends by itself 15 minutes after the freeze." >&2
