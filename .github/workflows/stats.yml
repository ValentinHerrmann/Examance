name: Code statistics

# Counts lines per area and publishes the README statistics table and history chart (SVG) to the orphan `badges` branch.
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    name: Count lines and update badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history chart samples one commit per day
      - name: Count lines
        run: |
          set -euo pipefail
          # Previous history.json lets the script recount only new days.
          if git fetch -q --depth=1 origin badges; then git show FETCH_HEAD:history.json > "$RUNNER_TEMP/history.json" || true; fi
          python3 .github/scripts/code_stats.py "$RUNNER_TEMP/badges-out" "$RUNNER_TEMP/history.json"
      - name: Publish to the badges branch
        run: |
          set -euo pipefail
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/badges" && mkdir "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git remote add origin "$url"
          if git fetch -q --depth=1 origin badges; then git reset -q --hard FETCH_HEAD; fi
          git rm -rq --ignore-unmatch . 
          cp "$RUNNER_TEMP"/badges-out/* .
          git add -A
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -q -m "Update code statistics [skip ci]"
          git push -q origin badges
