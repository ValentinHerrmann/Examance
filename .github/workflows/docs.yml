name: Docs

# Publishes the documentation site (docs/, VitePress) to GitHub Pages from the `release` branch, so it matches the live version.
# deploy-release.yml calls this after it pushed `release`: that push uses GITHUB_TOKEN, which never starts other workflows.
# One-time repository setting: Settings → Pages → Source "GitHub Actions".
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install and build
        working-directory: docs
        run: npm ci && npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
