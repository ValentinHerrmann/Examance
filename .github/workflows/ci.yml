name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blindgrade
          POSTGRES_PASSWORD: blindgrade
          POSTGRES_DB: blindgrade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blindgrade -d blindgrade_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: cd backend && uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: cd backend && ruff check app
      - name: Mypy
        run: cd backend && mypy app
      - name: Alembic migration check
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://blindgrade:blindgrade@localhost:5432/blindgrade_test
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-not-for-production
        run: cd backend && alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://blindgrade:blindgrade@localhost:5432/blindgrade_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-not-for-production
          CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
        run: cd backend && pytest --cov=app --cov-report=xml
      # NOTE: pip-audit has no --severity flag, and -r expects a requirements
      # file rather than a pyproject. The previous invocation combined both and
      # exited 2 on an argument error, so this step never actually audited
      # anything. Auditing the project path checks the declared dependency set
      # and fails on ANY known advisory, which is stricter than the "HIGH only"
      # the step name used to claim.
      - name: pip-audit (fail on any known advisory)
        run: pip install pip-audit && pip-audit backend/

  frontend:
    name: Frontend — lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          # npm's cache key must come from the lockfile; package.json does not
          # pin resolved versions.
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm ci
      - name: ESLint
        run: cd frontend && npm run lint
      - name: TypeScript check
        run: cd frontend && npm run check
      - name: Vitest
        run: cd frontend && npm run test:unit
      # The app is a static bundle: only "dependencies" ends up in what we ship
      # to a browser, while the build toolchain (Vite, SvelteKit, ESLint, ...)
      # never runs anywhere but CI and developer machines. Gating on the full
      # tree means a dev-server-only advisory (e.g. the Vite `server.fs.deny`
      # bypass, GHSA-fx2h-pf6j-xcff) blocks every deploy and can only be
      # cleared by a Svelte 5 / Vite 7 migration. So the blocking gate audits
      # the shipped dependency set, and the whole tree is reported separately
      # for visibility without failing the job.
      - name: npm audit — shipped deps (fail on HIGH)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: npm audit — full tree (report only)
        if: always()
        run: cd frontend && npm audit || true
      - name: SRI verification
        run: cd frontend && npm run sri:verify
