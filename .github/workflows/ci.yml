name: CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    # The app runs from its source directory and is not installed as a package (same as the Docker image).
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blindgrade
          # Throwaway database that only this runner reaches: trust auth, so no password exists to leak or hard-code.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: blindgrade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blindgrade -d blindgrade_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      # A pyproject.toml change without `uv lock` fails here instead of shipping unlocked versions.
      - name: Lockfile up to date
        run: cd backend && uv lock --check
      # Exactly the locked versions, hash-checked wheels only, so no dependency runs setup code.
      - name: Install deps
        run: |
          cd backend
          uv export --frozen --all-extras --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --system --require-hashes --no-build -r "$RUNNER_TEMP/requirements.txt"
      - name: Ruff lint
        run: cd backend && ruff check app
      - name: Mypy
        run: cd backend && mypy app
      # docs/openapi.json is generated; a route change must regenerate it (python -m app.cli export-openapi).
      - name: OpenAPI drift check
        env:
          ENVIRONMENT: development
        run: cd backend && python -m app.cli export-openapi && git diff --exit-code -- ../docs/openapi.json
      - name: Alembic migration check
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://blindgrade@localhost:5432/blindgrade_test
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-not-for-production
        run: cd backend && alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://blindgrade@localhost:5432/blindgrade_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-not-for-production
          FRONTEND_URL: http://localhost:5173
        run: cd backend && pytest --cov=app --cov-report=xml
      # The exported lock is exactly what CI and the Docker image install; pip-audit has no --severity flag, so ANY known advisory fails.
      - name: pip-audit (fail on any known advisory)
        run: pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip

  frontend:
    name: Frontend — lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: "npm"
          # npm's cache key must come from the lockfile; package.json does not
          # pin resolved versions.
          cache-dependency-path: frontend/package-lock.json
      # No lifecycle scripts: the only package with one is fsevents (macOS only).
      - name: Install deps
        run: cd frontend && npm ci --ignore-scripts
      - name: ESLint
        run: cd frontend && npm run lint
      - name: TypeScript check
        run: cd frontend && npm run check
      - name: Vitest
        run: cd frontend && npm run test:unit
      # Only "dependencies" ship to the browser; the toolchain runs in CI and on dev machines only.
      # Gate on the shipped set so a dev-server-only advisory cannot block deploys; report the full tree.
      - name: npm audit — shipped deps (fail on HIGH)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: npm audit — full tree (report only)
        if: always()
        run: cd frontend && npm audit || true
      # Not enforced yet: nothing is vendored, so this reports the missing control (docs/THIRD_PARTY_LICENSES.md, issue #296).
      - name: SRI manifest (not enforced yet)
        run: cd frontend && npm run sri:verify

  # Layout and accessibility on the three main devices (issue #183), one job per device and check group so they run side by side; the API is the in-memory fake, so no backend runs.
  e2e:
    name: Frontend — Playwright (${{ matrix.device }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, ipad-portrait, phone]
        group: [routes, a11y, shell]
        exclude:
          # a11y.spec runs on desktop and phone only.
          - device: ipad-portrait
            group: a11y
        # Every test of layout.spec and a11y.spec lands in exactly one group: "shell" takes all of layout.spec but the route loops.
        include:
          - group: routes
            args: e2e/layout.spec.ts --grep=routes.do.not.scroll
          - group: a11y
            args: e2e/a11y.spec.ts
          - group: shell
            args: e2e/layout.spec.ts --grep-invert=routes.do.not.scroll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules
          key: e2e-node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/.node-version') }}
      # No lifecycle scripts: the only ones in the tree are macOS-only fsevents.
      - name: Install deps
        if: steps.modules.outputs.cache-hit != 'true'
        run: cd frontend && npm ci --ignore-scripts
      # The locked binaries from the lockfile, never an on-demand `npx` download. tsconfig.json extends the generated `$app/tsconfig`, which Playwright reads when it loads the config.
      - name: SvelteKit sync
        run: cd frontend && ./node_modules/.bin/svelte-kit sync
      # Headless runs use only the headless shell, so the full Chrome and FFmpeg are not downloaded.
      - name: Install Chromium
        run: cd frontend && ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Playwright specs
        env:
          ARGS: ${{ matrix.args }}
          DEVICE: ${{ matrix.device }}
        # ARGS is split into words on purpose.
        run: cd frontend && ./node_modules/.bin/playwright test $ARGS --project="$DEVICE"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.device }}-${{ matrix.group }}
          path: frontend/playwright-report
          retention-days: 7

  scripts:
    name: Deploy scripts — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maintenance announce script
        run: .github/scripts/test-maintenance-announce.sh

  docs:
    name: Docs site — build (dead links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install and build
        working-directory: docs
        run: npm ci --ignore-scripts && npm run docs:build
