# Deployed stack (dev: ../docker-compose.yml), one per environment via `-p examance-prod|preview`;
# the project name keeps preview away from production data.
# Migrate first: docker compose -p <project> --env-file .env run --rm migrate

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blindgrade}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-blindgrade}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-blindgrade}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-blindgrade}
  REDIS_URL: redis://redis:6379/0
  # No default: compose refuses to start until SECRET_KEY is set in the env
  # file. Generate one per environment with: openssl rand -hex 32
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — generate with "openssl rand -hex 32"}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  # Required — the app refuses to start on an empty list, and there is no
  # wildcard fallback. Must name the frontend origin for THIS environment.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-[]}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  # Default must stay off *.pages.dev — that domain is URL-blocklisted and mail
  # relays reject password-reset links pointing at it (see config.py).
  FRONTEND_URL: ${FRONTEND_URL:-https://examance.valentin-herrmann.com}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@examance.com}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  PASSWORD_RESET_TOKEN_TTL_HOURS: ${PASSWORD_RESET_TOKEN_TTL_HOURS:-24}
  REGISTRATION_TOKEN_TTL_HOURS: ${REGISTRATION_TOKEN_TTL_HOURS:-24}
  REGISTRATION_RESEND_COOLDOWN_SECONDS: ${REGISTRATION_RESEND_COOLDOWN_SECONDS:-300}
  PENDING_ACCOUNT_RETENTION_DAYS: ${PENDING_ACCOUNT_RETENTION_DAYS:-90}
  # Scan file partition (docs/dev/storage_partitions.md). Empty dir = scans stay in Postgres.
  BLOB_STORAGE_BACKEND: ${BLOB_STORAGE_BACKEND:-db}
  BLOB_STORAGE_DIR: ${BLOB_STORAGE_DIR:-}

# Host dir (e.g. an rclone mount) or the named volume; mounted into every service touching scans.
x-blob-volume: &blob-volume ${BLOB_STORAGE_HOST_DIR:-blob_data}:/data/blobs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blindgrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-blindgrade}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Deliberately no `ports:` — Postgres is reachable only on the compose
    # network. Use `docker compose exec db psql` for maintenance.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blindgrade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Deliberately no `ports:` — rate-limit counters are internal state.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: `docker compose run --rm migrate`. Never started by `up`, so a
  # restart cannot re-run migrations behind your back.
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    volumes:
      - *blob-volume
    profiles:
      - tools
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment:
      <<: *backend-env
      LATEX_WORKER_URL: http://latex:8001
    networks: [default, latex]
    # Bound to loopback only: Caddy on the host terminates TLS and proxies to
    # this port. Publishing on 0.0.0.0 would expose the API without TLS.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - *blob-volume
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      latex:
        condition: service_started
    # --forwarded-allow-ips names the reverse proxy (the docker bridge gateway behind Caddy, not
    # 127.0.0.1). Set PROXY_ALLOWED_IPS to that gateway/CIDR, never "*": any client could then
    # spoof its rate-limit bucket and poison the audit log's IP hashes.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${PROXY_ALLOWED_IPS:-127.0.0.1}
    healthcheck:
      # Started with an empty environment: a LaTeX compile can read /proc of same-user processes.
      test: ["CMD", "env", "-i", "PATH=/usr/local/bin:/usr/bin:/bin", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Tectonic in its own container: a TeX document can read any file its process may read, so it
  # gets no secrets, no database or Redis network and no scan files. Reached only by the backend.
  latex:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment:
      HOME: /tmp
      LATEX_MAX_CONCURRENT_COMPILES: ${LATEX_MAX_CONCURRENT_COMPILES:-2}
    command: ["uvicorn", "app.latex_worker:app", "--host", "0.0.0.0", "--port", "8001"]
    networks: [latex]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Tectonic cache: an empty one makes the first compile exceed the proxy timeout (a bare
    # 504/524 that browsers report as a CORS error). Public TeX files only, never exam content.
    volumes:
      - tectonic_cache:/var/cache/tectonic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Retention sweep at start, then daily: deploys recreate this container, so sleep-first would
  # postpone it forever. Runs the backend image directly; the dev compose file's busybox
  # `docker exec` cannot work here (no docker CLI, other container name).
  retention-cron:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - *blob-volume
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python -m app.cli run-retention || echo "retention sweep failed" >&2
          sleep 86400
        done

  # Opt-in nightly restic backup (`COMPOSE_PROFILES=backup`): 00:00 in BACKUP_TZ, never on container
  # start; retention from .env. Erased records survive until forgotten (docs/backup_and_restore.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - backup
    # Fixed: restic groups snapshots by host, and a random name per deploy would never expire.
    hostname: examance-backup
    environment:
      TZ: ${BACKUP_TZ:-Europe/Berlin}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-blindgrade}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-blindgrade}
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-}
      RESTIC_CACHE_DIR: /cache
      BACKUP_KEEP_DAILY_DAYS: ${BACKUP_KEEP_DAILY_DAYS:-7}
      BACKUP_KEEP_WEEKLY_WEEKS: ${BACKUP_KEEP_WEEKLY_WEEKS:-4}
      BACKUP_KEEP_MONTHLY_MONTHS: ${BACKUP_KEEP_MONTHLY_MONTHS:-3}
    volumes:
      - ${BLOB_STORAGE_HOST_DIR:-blob_data}:/data/blobs:ro
      - restic_cache:/cache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        [ -n "$$RESTIC_REPOSITORY" ] && [ -n "$$RESTIC_PASSWORD" ] \
          || { echo "BACKUP_RESTIC_REPOSITORY and BACKUP_RESTIC_PASSWORD must be set" >&2; exit 1; }
        apk add --no-cache restic tzdata >/dev/null || exit 1
        restic cat config >/dev/null 2>&1 || restic init || exit 1
        echo "backup service ready; next snapshot at 00:00 ($$TZ)"
        last_run=$$(date +%F)
        while true; do
          sleep 60
          # Runs once per local date, right after midnight.
          [ "$$(date +%F)" != "$$last_run" ] || continue
          last_run=$$(date +%F)
          restic unlock >/dev/null 2>&1
          # Plain SQL (not -Fc): an already compressed dump would never deduplicate.
          restic backup --quiet --tag db --stdin-filename examance.sql \
            --stdin-from-command -- pg_dump --no-owner \
            && echo "db snapshot done" || echo "db snapshot failed" >&2
          # Never back up an unmarked dir: a dropped mount would look like "every scan deleted".
          if [ -f /data/blobs/.examance-blobstore ]; then
            restic backup --quiet --tag blobs /data/blobs \
              && echo "blob snapshot done" || echo "blob snapshot failed" >&2
          else
            echo "blob snapshot skipped: /data/blobs is not a marked blob store" >&2
          fi
          # Exactly the configured retention for the scheduled snapshots. `maintenance` snapshots
          # have their own (maintenance-backup service); `pre-restore` keeps the last ten as well.
          restic forget --quiet --group-by tags --tag db --tag blobs \
            --keep-daily "$$BACKUP_KEEP_DAILY_DAYS" --keep-weekly "$$BACKUP_KEEP_WEEKLY_WEEKS" \
            --keep-monthly "$$BACKUP_KEEP_MONTHLY_MONTHS" || echo "forget failed" >&2
          restic forget --quiet --group-by tags --tag pre-restore --keep-last 10 \
            --keep-daily "$$BACKUP_KEEP_DAILY_DAYS" --keep-weekly "$$BACKUP_KEEP_WEEKLY_WEEKS" \
            --keep-monthly "$$BACKUP_KEEP_MONTHLY_MONTHS" || echo "forget failed" >&2
          restic prune --quiet || echo "prune failed" >&2
          restic check --quiet || echo "repository check failed" >&2
        done

  # Database backup before every update and, if the admin asks, before manual maintenance (issue
  # #130). Independent of `backup`: no profile, restic optional (off-site copy only). It claims a due
  # backup in maintenance_window (app/models/maintenance_window.py) once teaching writes stopped.
  maintenance-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-blindgrade}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-blindgrade}
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-}
      RESTIC_CACHE_DIR: /cache
      BACKUP_KEEP_MAINTENANCE: ${BACKUP_KEEP_MAINTENANCE:-10}
    volumes:
      - ./maintenance-backups:/backups
      - restic_cache:/cache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        umask 077
        offsite=no
        if [ -n "$$RESTIC_REPOSITORY" ] && [ -n "$$RESTIC_PASSWORD" ]; then
          apk add --no-cache restic >/dev/null && offsite=yes
        fi
        q() { psql -X -q -At -v ON_ERROR_STOP=1 -c "$$1"; }
        echo "maintenance-backup ready (off-site copy: $$offsite)"
        while true; do
          sleep 5
          # 5 s after the freeze: the backend's phase cache is through (in-flight writes: see docs).
          rev=$$(q "UPDATE maintenance_window SET backup_state = 'running', updated_at = now()
            WHERE id = 1 AND ended_at IS NULL AND backup_wanted AND backup_state IS NULL
              AND (auto_end_at IS NULL OR auto_end_at > now())
              AND ((kind = 'deployment' AND frozen_at <= now() - interval '5 seconds')
                OR (kind = 'manual' AND starts_at <= now() - interval '5 seconds'))
            RETURNING revision" 2>/dev/null) || continue
          [ -n "$$rev" ] || continue
          file="$$(date -u +%Y%m%dT%H%M%SZ)-rev$$rev.sql"
          if pg_dump --no-owner > "/backups/$$file.part" && [ -s "/backups/$$file.part" ]; then
            mv "/backups/$$file.part" "/backups/$$file"
            next=skipped; [ "$$offsite" = yes ] && next=running
            q "UPDATE maintenance_window SET backup_state = 'done', backup_file = '$$file',
              backup_finished_at = now(), offsite_state = '$$next' WHERE id = 1 AND revision = $$rev"
            echo "maintenance backup $$file done"
            ls -1t /backups/*.sql | tail -n +"$$((BACKUP_KEEP_MAINTENANCE + 1))" | xargs -r rm -f
            if [ "$$offsite" = yes ]; then
              # After "done": the deploy already continues, so the upload costs no downtime.
              (restic cat config >/dev/null 2>&1 || restic init >/dev/null) \
                && restic --retry-lock 10m backup --quiet --tag maintenance \
                  --stdin-filename examance.sql --stdin-from-command -- cat "/backups/$$file" \
                && restic --retry-lock 10m forget --quiet --tag maintenance \
                  --keep-last "$$BACKUP_KEEP_MAINTENANCE" --prune \
                && state=done || state=failed
              q "UPDATE maintenance_window SET offsite_state = '$$state'
                WHERE id = 1 AND revision = $$rev" || true
              echo "maintenance backup off-site copy: $$state"
            fi
          else
            rm -f "/backups/$$file.part"
            q "UPDATE maintenance_window SET backup_state = 'failed' WHERE id = 1 AND revision = $$rev" || true
            echo "maintenance backup FAILED" >&2
          fi
        done

volumes:
  pg_data:
  tectonic_cache:
  blob_data:
  restic_cache:


networks:
  # Not internal: Tectonic downloads TeX bundle files it has not cached yet.
  latex: {}
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:?set NETWORK_SUBNET in .env}

