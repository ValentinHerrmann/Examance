# Deployed stack (dev: ../docker-compose.yml), one per environment via `-p examance-prod|preview`;
# the project name keeps preview away from production data.
# Migrate first: docker compose -p <project> --env-file .env run --rm migrate

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blindgrade}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-blindgrade}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-blindgrade}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-blindgrade}
  REDIS_URL: redis://redis:6379/0
  # No default: compose refuses to start until SECRET_KEY is set in the env
  # file. Generate one per environment with: openssl rand -hex 32
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — generate with "openssl rand -hex 32"}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  # Required — the app refuses to start on an empty list, and there is no
  # wildcard fallback. Must name the frontend origin for THIS environment.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-[]}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  # Default must stay off *.pages.dev — that domain is URL-blocklisted and mail
  # relays reject password-reset links pointing at it (see config.py).
  FRONTEND_URL: ${FRONTEND_URL:-https://examance.valentin-herrmann.com}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@examance.com}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  PASSWORD_RESET_TOKEN_TTL_HOURS: ${PASSWORD_RESET_TOKEN_TTL_HOURS:-24}
  REGISTRATION_TOKEN_TTL_HOURS: ${REGISTRATION_TOKEN_TTL_HOURS:-24}
  REGISTRATION_RESEND_COOLDOWN_SECONDS: ${REGISTRATION_RESEND_COOLDOWN_SECONDS:-300}
  PENDING_ACCOUNT_RETENTION_DAYS: ${PENDING_ACCOUNT_RETENTION_DAYS:-90}
  # Scan file partition (docs/dev/storage_partitions.md). Empty dir = scans stay in Postgres.
  BLOB_STORAGE_BACKEND: ${BLOB_STORAGE_BACKEND:-db}
  BLOB_STORAGE_DIR: ${BLOB_STORAGE_DIR:-}

# Host dir (e.g. an rclone mount) or the named volume; mounted into every service touching scans.
x-blob-volume: &blob-volume ${BLOB_STORAGE_HOST_DIR:-blob_data}:/data/blobs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blindgrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-blindgrade}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Deliberately no `ports:` — Postgres is reachable only on the compose
    # network. Use `docker compose exec db psql` for maintenance.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blindgrade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Deliberately no `ports:` — rate-limit counters are internal state.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: `docker compose run --rm migrate`. Never started by `up`, so a
  # restart cannot re-run migrations behind your back.
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    volumes:
      - *blob-volume
    profiles:
      - tools
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment: *backend-env
    # Bound to loopback only: Caddy on the host terminates TLS and proxies to
    # this port. Publishing on 0.0.0.0 would expose the API without TLS.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    # Tectonic cache: an empty one makes the first compile exceed the proxy timeout (a bare
    # 504/524 that browsers report as a CORS error). Public TeX files only, never exam content.
    volumes:
      - tectonic_cache:/var/cache/tectonic
      - *blob-volume
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --forwarded-allow-ips names the reverse proxy (the docker bridge gateway behind Caddy, not
    # 127.0.0.1). Set PROXY_ALLOWED_IPS to that gateway/CIDR, never "*": any client could then
    # spoof its rate-limit bucket and poison the audit log's IP hashes.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${PROXY_ALLOWED_IPS:-127.0.0.1}
    healthcheck:
      # Started with an empty environment: a LaTeX compile can read /proc of same-user processes.
      test: ["CMD", "env", "-i", "PATH=/usr/local/bin:/usr/bin:/bin", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Retention sweep at start, then daily: deploys recreate this container, so sleep-first would
  # postpone it forever. Runs the backend image directly; the dev compose file's busybox
  # `docker exec` cannot work here (no docker CLI, other container name).
  retention-cron:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - *blob-volume
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python -m app.cli run-retention || echo "retention sweep failed" >&2
          sleep 86400
        done

  # Opt-in daily backup (docs/dev/storage_partitions.md): `--profile backup`. BACKUP_REMOTE must be
  # an rclone *crypt* remote: the dump holds plaintext tables. Dumps rotate daily/weekly/monthly;
  # deleted scans stay as long as the oldest monthly dump, which bounds how long erased data survives.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-blindgrade}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-blindgrade}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_KEEP_DAILY_DAYS: ${BACKUP_KEEP_DAILY_DAYS:-2}
      BACKUP_KEEP_WEEKLY_WEEKS: ${BACKUP_KEEP_WEEKLY_WEEKS:-2}
      BACKUP_KEEP_MONTHLY_MONTHS: ${BACKUP_KEEP_MONTHLY_MONTHS:-2}
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      - ${BLOB_STORAGE_HOST_DIR:-blob_data}:/data/blobs:ro
      - ${BACKUP_RCLONE_CONFIG:-./rclone.conf}:/config/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u -o pipefail
        [ -n "$$BACKUP_REMOTE" ] || { echo "BACKUP_REMOTE is not set" >&2; exit 1; }
        apk add --no-cache rclone >/dev/null || exit 1
        R="$$BACKUP_REMOTE"
        D=$$BACKUP_KEEP_DAILY_DAYS W=$$BACKUP_KEEP_WEEKLY_WEEKS M=$$BACKUP_KEEP_MONTHLY_MONTHS
        age() {  # whole days since <YYYY-MM-DD>; fails for names that are not dates
          t=$$(date -u -d "$$1 00:00" +%s) || return 1; n=$$(date -u +%s)
          echo $$((n / 86400 - t / 86400))
        }
        prune_dumps() {  # every dump of the last D days, the newest per ISO week / month in the window
          weeks=" " months=" "
          rclone lsf "$$R/db" 2>/dev/null | sort -r | while read -r f; do
            d=$${f%%.*}; a=$$(age "$$d" 2>/dev/null) || continue
            case "$$f" in *.partial) [ "$$a" -ge 1 ] && rclone deletefile "$$R/db/$$f"; continue;; esac
            w=$$(date -u -d "$$d 00:00" +%G-%V) m=$${d%-*} keep=0
            [ "$$a" -lt "$$D" ] && keep=1
            case "$$weeks" in *" $$w "*) ;; *) weeks="$$weeks$$w "; [ "$$a" -lt $$((W * 7)) ] && keep=1;; esac
            case "$$months" in *" $$m "*) ;; *) months="$$months$$m "; [ "$$a" -lt $$((M * 31)) ] && keep=1;; esac
            [ "$$keep" = 1 ] || rclone deletefile "$$R/db/$$f"
          done
        }
        prune_deleted() {  # an old dump needs every scan deleted since, so keep as long as monthly
          rclone lsf --dirs-only "$$R/blobs/deleted" 2>/dev/null | while read -r dir; do
            a=$$(age "$${dir%/}" 2>/dev/null) || continue
            [ "$$a" -lt $$((M * 31)) ] || rclone purge "$$R/blobs/deleted/$${dir%/}"
          done
        }
        while true; do
          day=$$(date -u +%Y-%m-%d)
          if pg_dump -Fc | rclone rcat "$$R/db/$$day.dump.partial" \
              && rclone moveto "$$R/db/$$day.dump.partial" "$$R/db/$$day.dump"; then
            echo "db dump $$day done"
          else
            echo "db dump failed" >&2
          fi
          # Never sync an unmarked dir: a dropped mount would look like "every scan deleted".
          if [ -f /data/blobs/.examance-blobstore ]; then
            rclone sync /data/blobs "$$R/blobs/current" --backup-dir "$$R/blobs/deleted/$$day" \
              || echo "blob sync failed" >&2
          fi
          prune_dumps
          prune_deleted
          sleep 86400
        done

volumes:
  pg_data:
  tectonic_cache:
  blob_data:


networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:?set NETWORK_SUBNET in .env}

